name: Test

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check package.json
        run: python -c "import json; print('version:', json.load(open('package.json'))['version'])"
      - name: README check
        run: grep -oE 'https?://[^ )]+' README.md | head -3 && echo "links OK"
      - name: SKILL.md has required fields
        run: |
          grep -q "name: openvl" SKILL.md || exit 1
          grep -q "description:" SKILL.md || exit 1
          grep -q "read_when:" SKILL.md || exit 1
          echo "SKILL.md OK"
      - name: Config example valid
        run: |
          grep -q "VISION_API_KEY" config.env.example || exit 1
          grep -q "VISION_API_BASE" config.env.example || exit 1
          grep -q "VISION_MODEL" config.env.example || exit 1
          echo "config.env.example OK"

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install requests pillow

      - name: Syntax
        run: python -c "compile(open('scripts/vision.py',encoding='utf-8').read(),'test','exec'); print('OK')"

      - name: --help / -v
        run: python scripts/vision.py --help && python scripts/vision.py -v

      - name: Config read/write
        run: |
          python -c "
          import sys, tempfile, os
          sys.path.insert(0, 'scripts')
          # test API type detection
          exec(open('scripts/vision.py',encoding='utf-8').read().split('def doctor')[0])
          assert 'chat' in str(detect_api_type('https://test.com/v1/chat/completions'))
          assert 'responses' in str(detect_api_type('https://test.com/v1/responses'))
          assert 'gemini' in str(detect_api_type('https://generativelanguage.googleapis.com'))
          assert 'claude' in str(detect_api_type('https://api.anthropic.com'))
          print('detect_api_type: OK')
          "

      - name: Invalid image
        run: python scripts/vision.py /nonexistent/image.png 2>&1 || true

      - name: Unsupported format
        run: python -c "open('test.txt','w').write('not an image')" && python scripts/vision.py test.txt 2>&1 || true

      - name: -s flag parsing
        run: python scripts/vision.py -s 512 2>&1 | head -2

      - name: doctor (no key)
        run: python scripts/vision.py doctor 2>&1
        continue-on-error: true

      - name: doctor (with key)
        continue-on-error: true
        env:
          VISION_API_KEY: ${{ secrets.API_KEY || '' }}
          VISION_API_BASE: ${{ secrets.API_BASE || '' }}
          VISION_MODEL: ${{ secrets.MODEL || '' }}
        run: python scripts/vision.py doctor 2>&1

      - name: Image via file
        run: |
          python -c "
          import base64
          b = bytes([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,0x54,0x08,0xD7,0x63,0x60,0x60,0x60,0x00,0x00,0x00,0x04,0x00,0x01,0x27,0x34,0x27,0x0E,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,0xAE,0x42,0x60,0x82])
          with open('test.png','wb') as f: f.write(b)
          "
          python scripts/vision.py test.png 2>&1 | head -5
        env:
          VISION_API_KEY: ${{ secrets.API_KEY || '' }}
          VISION_API_BASE: ${{ secrets.API_BASE || '' }}
        continue-on-error: true

      - name: Image via --base64
        run: |
          B64=$(python -c "import base64; print(base64.b64encode(bytes([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,0x54,0x08,0xD7,0x63,0x60,0x60,0x60,0x00,0x00,0x00,0x04,0x00,0x01,0x27,0x34,0x27,0x0E,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,0xAE,0x42,0x60,0x82])).decode())
          python scripts/vision.py --base64 "$B64" "test" 2>&1 | head -5
        continue-on-error: true

      - name: Image via --stdin
        run: |
          python -c "import base64; print('data:image/png;base64,'+base64.b64encode(bytes([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,0x54,0x08,0xD7,0x63,0x60,0x60,0x60,0x00,0x00,0x00,0x04,0x00,0x01,0x27,0x34,0x27,0x0E,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,0xAE,0x42,0x60,0x82])).decode())" | python scripts/vision.py --stdin 2>&1 | head -5
        continue-on-error: true

      - name: Multi-image
        run: |
          python -c "import base64; open('t1.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          cp t1.png t2.png
          python scripts/vision.py t1.png t2.png 2>&1 | head -5
        continue-on-error: true

      - name: Doctor with local config
        continue-on-error: true
        run: |
          mkdir -p .pi/agent/skills/openvl
          echo 'VISION_API_KEY=test-key' > .pi/agent/skills/openvl/config.env
          python scripts/vision.py doctor 2>&1

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax
        run: node --check bin/openvl && node --check scripts/mcp_server.js
      - name: MCP tools/list
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | timeout 5 node scripts/mcp_server.js 2>/dev/null | python3 -c "
          import sys,json
          d=json.loads(sys.stdin.read())
          assert len(d['result']['tools']) == 2
          names = [t['name'] for t in d['result']['tools']]
          assert 'describe_image' in names
          assert 'describe_clipboard' in names
          print(f'MCP OK: {names}')
          "
      - name: Plugin syntax
        run: |
          node -e "require('fs').readFileSync('integrations/opencode/openvl-image.mjs','utf8'); console.log('plugin OK')"
