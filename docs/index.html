<script>
const result = `这是一张网页截图，内容是硅基流动（SiliconFlow）后台的"推荐官计划"页面。

左侧导航：实名认证、API 密钥、余额充值、费用明细、发票开具、推荐官计划。

推荐官福利：每邀一人注册认证即得 16 元代金券
邀请码：eQMNF05N
累计完成 1 次有效推荐，共获得 16 元代金券。`;

const lines = [
  { id: 'tl0', text: '$ [Image 1] 这是什么' },
  { id: 'tl1', text: '+ Thought · 368ms' },
  { id: 'tl2', text: '→ Skill "openvl"' },
  { id: 'tl3', text: '$ openvl -c "这是什么"' },
  { id: 'tl4', text: '+ Thought · 324ms' },
  { id: 'tl5', text: '$ openvl "C:\\Users\\33795\\AppData\\Local\\Temp\\openvl_001.png"' },
];

function playDemo() {
  // Clear all lines
  lines.forEach(l => {
    const el = document.getElementById(l.id);
    el.textContent = '';
    el.style.opacity = '0';
  });
  document.getElementById('tl6').textContent = '';
  document.getElementById('tl6').style.opacity = '0';
  document.getElementById('cursor').style.display = 'block';

  let totalDelay = 0;
  lines.forEach((l, idx) => {
    const el = document.getElementById(l.id);
    const typeSpeed = l.text.startsWith('$ ') ? 25 : 10;
    const initialWait = idx === 0 ? 200 : (l.text.startsWith('+') ? 600 : 500);
    totalDelay += initialWait;
    setTimeout(() => {
      el.style.opacity = '1';
      let i = 0;
      const iv = setInterval(() => {
        if (i < l.text.length) { el.textContent += l.text[i]; i++; }
        else { clearInterval(iv); }
      }, typeSpeed);
    }, totalDelay);
  });

  // Result text
  const resultDelay = totalDelay + 800;
  setTimeout(() => {
    const el = document.getElementById('tl6');
    el.style.opacity = '1';
    let i = 0;
    const iv = setInterval(() => {
      if (i < result.length) { el.textContent += result[i]; i++; }
      else {
        clearInterval(iv);
        setTimeout(() => { document.getElementById('cursor').style.display = 'none'; }, 500);
        // Replay after 4s pause
        setTimeout(playDemo, 4000);
      }
    }, 8);
  }, resultDelay);
}

// Start first play after page load
setTimeout(playDemo, 300);
</script>
